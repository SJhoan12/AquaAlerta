spring.application.name=AquaAlerta

# MongoDB Atlas - base de datos aqua_alerta (Spring Boot 4 usa spring.mongodb.*)
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=aqua_alerta

# Render supplies PORT; local development defaults to 8080.
server.port=${PORT:8080}

# La API rechaza lecturas si esta clave no está configurada.
aquaalerta.sensor.api-key=${AQUAALERTA_SENSOR_API_KEY:}
aquaalerta.totp.encryption-key=${AQUAALERTA_TOTP_ENCRYPTION_KEY:}
# Keeps session identifiers in cookies instead of URLs.
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Local HTTP development; production profiles explicitly require Secure cookies.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
