<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - AquaAlerta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f7ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { background: #fff; border-radius: 16px; padding: 40px 35px; box-shadow: 0 10px 30px rgba(0,0,0,.08); width: 100%; max-width: 420px; text-align: center; }
        .logo-icon { font-size: 48px; }
        .logo h1 { color: #1e3a5f; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo mb-3">
        <div class="logo-icon">💧</div>
        <h1>AquaAlerta</h1>
        <p class="text-muted">Sistema de monitoreo de nivel de agua</p>
    </div>

    <h2>Crear cuenta</h2>
    <p class="text-muted">Regístrate para empezar a monitorear tu tanque</p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/registro}" th:object="${usuario}" method="post" class="text-start">
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input class="form-control" th:field="*{username}" placeholder="Elige un usuario" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Correo</label>
            <input class="form-control" type="email" th:field="*{email}" placeholder="tucorreo@ejemplo.com">
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input class="form-control" type="password" th:field="*{password}" placeholder="••••••••" required>
        </div>
        <input type="hidden" th:field="*{rol}">
        <button type="submit" class="btn btn-primary w-100">Registrarse</button>
    </form>

    <p class="mt-3 mb-0">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
