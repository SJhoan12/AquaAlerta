<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<aside th:fragment="sidebar(active, numAlertas)" class="sidebar">
    <div class="brand">
        <span class="brand-drop" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3C9.2 7.1 6 10.3 6 14a6 6 0 0 0 12 0c0-3.7-3.2-6.9-6-11Z"/><path d="M9.5 15.5a2.8 2.8 0 0 0 2.8 2.2"/></svg>
        </span>
        AquaAlerta
    </div>
    <button class="theme-toggle" type="button" aria-pressed="false"
            aria-label="Cambiar a modo oscuro">
        <span class="theme-icon" aria-hidden="true">☾</span>
        <span class="theme-label">Modo oscuro</span>
    </button>
    <button class="menu-toggle" type="button" aria-label="Abrir menú de navegación"
            aria-expanded="false" aria-controls="main-navigation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span>Menú</span>
    </button>
    <nav class="side-nav" id="main-navigation">
        <a th:href="@{/}" th:classappend="${active == 'inicio'} ? 'active' : ''">
            <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9M9 20v-7h6v7"/></svg></span> Inicio
        </a>
        <a th:if="${session.rol == 'ADMIN'}" th:href="@{/tanques}" th:classappend="${active == 'config'} ? 'active' : ''">
            <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></svg></span> Configuración
        </a>
        <a th:href="@{/historial}" th:classappend="${active == 'historial'} ? 'active' : ''">
            <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h17"/><path d="m7 15 4-4 3 2 5-6"/></svg></span> Historial
        </a>
        <a th:href="@{/alertas}" th:classappend="${active == 'alertas'} ? 'active' : ''">
            <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></span> Alertas
            <span th:if="${numAlertas != null and numAlertas > 0}" class="badge badge-small" th:text="${numAlertas}">2</span>
        </a>
    </nav>
    <div class="side-foot">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" name="_csrf" th:value="${session.csrfToken}">
            <button type="submit" class="logout-button">
                <span class="ico logout-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg></span> Cerrar sesión
            </button>
        </form>
    </div>
    <script>
        (function () {
            var toggle = document.querySelector('.menu-toggle');
            var sidebar = toggle && toggle.closest('.sidebar');
            if (!toggle || !sidebar) return;

            toggle.addEventListener('click', function () {
                var isOpen = sidebar.classList.toggle('menu-open');
                toggle.setAttribute('aria-expanded', String(isOpen));
                toggle.setAttribute('aria-label', isOpen ? 'Cerrar menú de navegación' : 'Abrir menú de navegación');
            });

            sidebar.querySelectorAll('.side-nav a').forEach(function (link) {
                link.addEventListener('click', function () {
                    sidebar.classList.remove('menu-open');
                    toggle.setAttribute('aria-expanded', 'false');
                    toggle.setAttribute('aria-label', 'Abrir menú de navegación');
                });
            });
        })();
    </script>
</aside>
</body>
</html>
