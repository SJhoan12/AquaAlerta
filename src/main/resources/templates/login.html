<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - AquaAlerta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f7ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { background: #fff; border-radius: 16px; padding: 40px 35px; box-shadow: 0 10px 30px rgba(0,0,0,.08); width: 100%; max-width: 420px; text-align: center; }
        .logo-icon { font-size: 48px; }
        .logo h1 { color: #1e3a5f; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo mb-3">
        <div class="logo-icon">💧</div>
        <h1>AquaAlerta</h1>
        <p class="text-muted">Sistema de monitoreo de nivel de agua</p>
    </div>

    <h2>Iniciar sesión</h2>
    <p class="text-muted">Ingresa tus credenciales para acceder</p>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/login}" method="post" class="text-start">
        <div class="mb-3">
            <label class="form-label" for="username">Usuario</label>
            <input class="form-control" type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>

    <p class="mt-3 mb-0">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a></p>
    <a href="#" class="d-inline-block mt-2">¿Olvidaste tu contraseña?</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
