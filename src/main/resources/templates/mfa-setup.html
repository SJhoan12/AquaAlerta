<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar segundo factor - AquaAlerta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script th:src="@{/theme.js(v=1)}"></script>
    <style>
        body { background: #f0f7ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 16px; }
        .mfa-card { background: #fff; border-radius: 16px; padding: 36px 30px; box-shadow: 0 10px 30px rgba(0,0,0,.08); width: 100%; max-width: 500px; }
        .secret { overflow-wrap: anywhere; font-family: monospace; font-size: 1.1rem; }
    </style>
    <link rel="stylesheet" th:href="@{/theme.css(v=1)}">
</head>
<body>
<main class="mfa-card">
    <div class="auth-theme-toggle">
        <button class="theme-toggle" type="button" aria-pressed="false"
                aria-label="Cambiar a modo oscuro">
            <span class="theme-icon" aria-hidden="true">☾</span>
            <span class="theme-label">Modo oscuro</span>
        </button>
    </div>
    <h1 class="h3">Activa la autenticación en dos pasos</h1>
    <p>En tu app autenticadora, agrega una cuenta TOTP de forma manual con esta clave. Se requiere el código de seis dígitos para completar la configuración.</p>
    <div class="alert alert-info secret" th:text="${secreto}">CLAVE TOTP</div>
    <p class="small text-muted">Guarda esta clave en un lugar seguro. No la compartas, permite generar los códigos de acceso.</p>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form th:action="@{/mfa/setup}" method="post">
        <input type="hidden" name="_csrf" th:value="${session.csrfToken}">
        <label class="form-label" for="codigo">Código de la app</label>
        <input class="form-control mb-3" id="codigo" name="codigo" inputmode="numeric"
               autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
        <button class="btn btn-primary w-100" type="submit">Verificar y activar</button>
    </form>
</main>
</body>
</html>
