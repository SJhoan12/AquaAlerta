services:
  mongodb:
    image: mongo:8.0
    container_name: aquaalerta-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  aquaalerta:
    build:
      context: .
      dockerfile: Dockerfile
    image: aquaalerta:local
    container_name: aquaalerta
    restart: unless-stopped
    ports:
      - "${AQUAALERTA_PORT:-8080}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: "8080"
      MONGODB_URI: "mongodb+srv://jhoanmanuelcs_db_user:H9GCngX46PifWwpX@aquaalerta.cvbbk3q.mongodb.net/aquaalerta_prod?retryWrites=true&w=majority&appName=aquaalerta"
      AQUAALERTA_SENSOR_API_KEY: "df75c400c01facf02dd33b8fa431ebe4fb815314e95c15c25c45ade59243b3c6"
      AQUAALERTA_TOTP_ENCRYPTION_KEY: "8f4e2b9c1a7d5e3f0b6c8a2d4e9f1b7c3a5d8e2f6b0c4a9d1e7f3b5c8a2d6e4f"
      SESSION_COOKIE_SECURE: "false"

volumes:
  mongo_data: