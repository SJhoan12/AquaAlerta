services:
  mongodb:
    image: mongo:8.0
    container_name: aquaalerta-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  aquaalerta:
    build:
      context: .
      dockerfile: Dockerfile
    image: aquaalerta:local
    container_name: aquaalerta
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AQUAALERTA_PORT:-8080}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: "8080"
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/aqua_alerta}
      AQUAALERTA_SENSOR_API_KEY: ${AQUAALERTA_SENSOR_API_KEY:-local-demo-only}
      AQUAALERTA_TOTP_ENCRYPTION_KEY: ${AQUAALERTA_TOTP_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}

volumes:
  mongo_data:
